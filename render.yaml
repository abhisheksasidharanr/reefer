# Render Blueprint: Reefer Monitor web service + PostgreSQL.
# Render dashboard → New → Blueprint → pick this repository.
# If this folder is not the repository root, uncomment `rootDir` below.

databases:
  - name: reefer-db
    databaseName: reefer
    user: reefer
    plan: basic-256mb
    # region: oregon        # keep the same region as the web service

services:
  - type: web
    name: reefer-monitor
    runtime: node
    plan: starter            # always on; the free plan sleeps and stops MQTT ingestion and alerts
    # region: oregon
    # rootDir: reefer
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma db push --skip-generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: reefer-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false            # asked for when the Blueprint is created
      - key: SEED_ADMIN_PASSWORD
        sync: false
